<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VS Track</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="apple-touch-icon" href="/static/logo.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Figtree', 'Segoe UI', sans-serif;
      background: #060a0b;
      color: #fcfcfc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #0a1316;
      border: 1px solid #1d3c46;
      border-radius:18px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #b5b5b5; font-size: 0.9rem; margin-bottom: 28px; }
    label { display: block; font-size: 0.85rem; color: #b5b5b5; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #060a0b;
      border: 1px solid #1d3c46;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fcfcfc;
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #6366f1; }
    button {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }
    .erro { color: #f87171; font-size: 0.85rem; margin-top: 12px; display: none; }
  
    /* Tema VS Track */
    body { background:#030303 radial-gradient(1000px 600px at -10% 110%, rgba(86,215,253,.18), transparent 60%); }
    .card { background:linear-gradient(180deg, rgba(17,43,51,.45), rgba(6,10,11,.95)), #070c0e; border:1px solid rgba(86,215,253,.14); border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    input { border-radius:12px; border-color:#14282f; background:#060a0b; }
    input:focus { border-color:#56d7fd; box-shadow:0 0 0 3px rgba(86,215,253,.12); outline:none; }
    button { font-family:inherit; border-radius:12px !important; font-weight:600; }
    button:not(.btn-secundario) { background:#56d7fd !important; color:#031a20 !important; box-shadow:0 0 24px rgba(86,215,253,.25); }
    button:not(.btn-secundario):hover { background:#8be5fe !important; }
    .btn-secundario { background:transparent !important; color:#b5b5b5 !important; border:1px solid #1d3c46 !important; }
    .btn-secundario:hover { border-color:#56d7fd !important; color:#fcfcfc !important; }
</style>
</head>
<body>
  <div class="card">
    <img src="/static/logo-vstrack.png" alt="VS Track" style="width:230px;height:auto;display:block;margin:0 auto 22px;filter:drop-shadow(0 0 14px rgba(86,215,253,.3))">
    <p style="text-align:center;margin-bottom:24px">Acesse o painel de conversões</p>
    <label>Email</label>
    <input type="email" id="email" placeholder="seu@email.com">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••">
    <button onclick="login()">Entrar</button>
    <button class="btn-secundario" onclick="cadastrar()" style="background:transparent;color:#b5b5b5;border:1px solid #1d3c46;margin-top:10px">Criar conta (novo projeto)</button>
    <div class="erro" id="erro"></div>
    <div id="ok" style="color:#4ade80;font-size:0.85rem;margin-top:12px;display:none"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://iimxiaeowdkruqvkmfhh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FoecAw-1cgx_cBqTOrG_AQ_Z0AiMa8s";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Se ja estiver logado, vai direto pro dashboard
    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "dashboard.html";
    });

    async function login() {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      const erro = document.getElementById("erro");
      erro.style.display = "none";

      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) {
        erro.textContent = "Email ou senha incorretos.";
        erro.style.display = "block";
      } else {
        window.location.href = "dashboard.html";
      }
    }

    async function cadastrar() {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const erro = document.getElementById("erro");
      const ok = document.getElementById("ok");
      erro.style.display = "none";
      ok.style.display = "none";

      if (!email || senha.length < 6) {
        erro.textContent = "Informe email e senha (mín. 6 caracteres).";
        erro.style.display = "block";
        return;
      }

      const resp = await fetch("/auth/cadastrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha }),
      });
      const data = await resp.json().catch(() => ({}));

      if (!resp.ok) {
        erro.textContent = data.detail || "Erro ao criar conta.";
        erro.style.display = "block";
        return;
      }
      ok.textContent = "Projeto criado! Já pode entrar (base zerada).";
      ok.style.display = "block";
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
